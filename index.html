section('COMPETITIVE LADDER','РЕЙТИНГИ','Позиции формируются только на основе сыгранных и подтверждённых матчей.','<div class="grid two"><div class="panel"><h3 class="panel-title">Командный рейтинг</h3><p class="muted">Таблица будет доступна после первых результатов.</p><a class="btn quiet" href="#/rankings" style="margin-top:10px">Открыть рейтинг</a></div><div class="panel"><h3 class="panel-title">Игроки</h3><p class="muted">Индивидуальная статистика и достижения участников.</p><a class="btn quiet" href="#/players" style="margin-top:10px">Каталог игроков</a></div></div>'),
'<section class="wrap section"><div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap"><div><div class="kicker">AUTOMATED MATCH VALIDATION</div><h2 style="font:800 30px Barlow Condensed;margin:8px 0">AUTO RESULT ENGINE</h2><p class="muted" style="max-width:540px">Автоматическое получение и проверка результатов. Публикация включается только после подключения источника данных.</p></div><a class="btn secondary" href="#/engine">Статус системы</a></div></section>'

'<section class="wrap section"><div id="teamResults">'+empty('mdi:account-group-outline','Команд пока нет','Здесь появятся команды, зарегистрированные в MERCY ARENA.')+'</div></section>'},

'<section class="wrap section"><div id="playerResults">'+empty('mdi:account-search-outline','Игроки не найдены','Профили появятся после подключения регистрации игроков.')+'</div></section>'},

'<section class="wrap section"><div class="grid two"><div class="panel"><div class="kicker">SCHEDULE</div><h3 class="panel-title" style="margin-top:10px">Расписание</h3><div id="matchSchedule"><p class="muted">Здесь будут предстоящие матчи и время начала.</p></div></div><div class="panel"><div class="kicker">RESULTS</div><h3 class="panel-title" style="margin-top:10px">Результаты</h3><div id="matchResults"><p class="muted">Итоги появляются только после подтверждения.</p></div></div></div><div id="matchEmpty" style="margin-top:14px">'+empty('mdi:tournament','Матчей пока нет','Сначала должен быть опубликован турнир и сформирована его сетка.')+'</div></section>'},
rankings:function(){return pageHead('COMPETITIVE LADDER','РЕЙТИНГИ','Турнирные таблицы команд и игроков. Рейтинг не рассчитывается по неподтверждённым матчам.')+
'<section class="wrap section"><div class="table-wrap"><table><thead><tr><th>#</th><th>Участник</th><th>Матчи</th><th>Победы</th><th>Очки</th></tr></thead><tbody id="rankingRows"><tr><td colspan="5" style="text-align:center;padding:35px;color:#9298a7">Рейтинг будет сформирован после первых подтверждённых матчей.</td></tr></tbody></table></div></section>'},
seasons:function(){return pageHead('SEASON SYSTEM','СЕЗОНЫ','Соревновательные периоды, этапы, квалификации и итоговые чемпионаты.')+
'<section class="wrap section"><div class="grid two"><div class="panel"><div class="statusbar"><span class="dot off"></span>НЕ АКТИВЕН</div><h3 class="panel-title" style="margin-top:14px">Текущий сезон</h3><p class="muted">Сезон будет объявлен вместе с календарём соревнований.</p></div><div class="panel"><div class="kicker">SEASON ARCHIVE</div><h3 class="panel-title" style="margin-top:14px">Архив сезонов</h3><p class="muted">Здесь сохраняются итоговые таблицы и чемпионы завершённых сезонов.</p></div></div><div style="margin-top:14px">'+empty('mdi:calendar-star-outline','Сезоны ещё не запущены','После объявления первого сезона здесь появятся этапы и календарь.')+'</div></section>'},
engine:function(){return pageHead('AUTOMATION / VERIFIED DATA','AUTO RESULT ENGINE','Система получения и проверки результатов матчей. Автоматическая публикация требует официального или надёжного источника игровых данных.')+
'<section class="wrap section"><div class="panel"><div class="statusbar"><span class="dot off"></span>ОЖИДАЕТ ПОДКЛЮЧЕНИЯ ИСТОЧНИКА</div><h3 class="panel-title" style="font-size:26px;margin-top:15px">Автоматическая обработка результатов отключена</h3><p class="muted">На данный момент MERCY ARENA не подключён к игровому API или поставщику турнирных данных. Поэтому сайт не может самостоятельно определить завершение матча или достоверно получить счёт.</p></div><div class="steps" style="margin-top:14px"><div class="step"><div class="step-num">01</div><h3>Получение</h3><p>Приём результата от подключённого источника с идентификатором матча и временем завершения.</p></div><div class="step"><div class="step-num">02</div><h3>Валидация</h3><p>Сверка участников, турнира, счёта и целостности данных. Конфликты отправляются на ручную проверку.</p></div><div class="step"><div class="step-num">03</div><h3>Публикация</h3><p>После подтверждения обновляются матч, сетка и рейтинг. Повторные события не должны дублировать результат.</p></div></div><div style="margin-top:14px">'+empty('mdi:shield-alert-outline','Публикация заблокирована до интеграции','Это намеренно: система не будет создавать фиктивные результаты или показывать неподтверждённые данные.')+'</div></section>'},
organizer:function(){return pageHead('ORGANIZER HUB','КАБИНЕТ ОРГАНИЗАТОРА','Инструменты управления турнирами, заявками, сетками, матчами и судейскими решениями.')+
'<section class="wrap section"><div class="grid two"><div class="panel"><div class="kicker">TOURNAMENT CONTROL</div><h3 class="panel-title" style="margin-top:10px">Управление турнирами</h3><p class="muted">Создание соревнований, выбор формата, расписания и правил.</p></div><div class="panel"><div class="kicker">TEAM APPLICATIONS</div><h3 class="panel-title" style="margin-top:10px">Заявки команд</h3><p class="muted">Проверка составов, допуск участников и управление слотами.</p></div><div class="panel"><div class="kicker">MATCH OPERATIONS</div><h3 class="panel-title" style="margin-top:10px">Матчи и сетки</h3><p class="muted">Назначение встреч, переносы и контроль статусов.</p></div><div class="panel"><div class="kicker">REFEREE DESK</div><h3 class="panel-title" style="margin-top:10px">Судейская</h3><p class="muted">Проверка спорных результатов и история решений.</p></div></div><div style="margin-top:14px">'+empty('mdi:lock-outline','Требуется аккаунт организатора','Авторизация и серверная ролевая модель ещё не подключены. Эта страница пока информационная, доступ к управлению не имитируется.')+'</div></section>'},
about:function(){return pageHead('THE PLATFORM','О MERCY ARENA','Турнирная платформа для сообщества Mobile Legends: Bang Bang, где соревнования и результаты должны быть прозрачными и проверяемыми.')+
'<section class="wrap section"><div class="grid"><div class="tile"><iconify-icon icon="mdi:trophy-outline"></iconify-icon><h3>Соревнования</h3><p>Турниры, правила, регистрация и сетки.</p></div><div class="tile"><iconify-icon icon="mdi:account-group-outline"></iconify-icon><h3>Сообщество</h3><p>Команды, игроки и история достижений.</p></div><div class="tile"><iconify-icon icon="mdi:shield-check-outline"></iconify-icon><h3>Достоверность</h3><p>Только проверенные результаты и прозрачные статусы.</p></div></div></section>'}
};
function route(){
var key=(location.hash.indexOf('#/')===0?location.hash.slice(2):location.hash.replace('#','')).split('/')[0]||'home';
if(!pages[key])key='home';
app.innerHTML=pages[key]();
document.querySelectorAll('[data-route]').forEach(function(a){a.classList.toggle('active',a.dataset.route===key)});
menu(false);window.scrollTo(0,0);document.title=(key==='home'?'MERCY ARENA':key.toUpperCase()+' — MERCY ARENA');
wireFilters(key);
}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function dateLabel(value){if(!value)return 'Дата уточняется';var d=new Date(value);return Number.isNaN(d.getTime())?'Дата уточняется':new Intl.DateTimeFormat('ru-RU',{dateStyle:'medium',timeStyle:'short'}).format(d)}
async function apiList(path){var response=await fetch('/api/v1/'+path,{headers:{accept:'application/json'},cache:'no-store'});if(!response.ok)throw new Error('API '+response.status);var payload=await response.json();return Array.isArray(payload.data)?payload.data:[]}
function cardList(items,kind){if(!items.length)return '';return '<div class="grid two">'+items.map(function(item){if(kind==='tournaments')return '<article class="tile"><div class="statusbar"><span class="dot"></span>'+esc(item.status)+'</div><h3>'+esc(item.title)+'</h3><p>'+esc(item.description||item.format||'Турнир MERCY ARENA')+'</p><p class="muted" style="margin-top:10px">'+esc(dateLabel(item.starts_at))+'</p></article>';if(kind==='teams')return '<article class="tile"><div class="kicker">'+esc(item.tag)+'</div><h3>'+esc(item.name)+'</h3><p>'+esc(item.region||'Регион не указан')+'</p></article>';return '<article class="tile"><h3>'+esc(item.nickname)+'</h3><p>'+esc(item.role||'Роль не указана')+' · '+esc(item.game_id||'Игровой ID не указан')+'</p></article>'}).join('')+'</div>'}
async function wireFilters(key){
try{
if(key==='tournaments'){var tournaments=await apiList('tournaments');var target=document.getElementById('tResults');if(target&&tournaments.length)target.innerHTML=cardList(tournaments,'tournaments')}
if(key==='teams'){var teams=await apiList('teams');var target=document.getElementById('teamResults');if(target&&teams.length)target.innerHTML=cardList(teams,'teams')}
if(key==='players'){var players=await apiList('players');var target=document.getElementById('playerResults');if(target&&players.length)target.innerHTML=cardList(players,'players')}
if(key==='brackets'){var matches=await apiList('matches');var schedule=document.getElementById('matchSchedule'),results=document.getElementById('matchResults'),emptyState=document.getElementById('matchEmpty');if(matches.length){if(emptyState)emptyState.innerHTML='';var upcoming=matches.filter(function(m){return m.status!=='completed'}),finished=matches.filter(function(m){return m.status==='completed'&&m.result_verified_at});if(schedule)schedule.innerHTML=upcoming.length?upcoming.map(function(m){return '<p class="muted">'+esc(dateLabel(m.scheduled_at))+' · Раунд '+esc(m.round_number)+' · '+esc(m.status)+'</p>'}).join(''):'<p class="muted">Предстоящих матчей нет.</p>';if(results)results.innerHTML=finished.length?finished.map(function(m){return '<p class="muted">Раунд '+esc(m.round_number)+' · '+esc(m.score_a)+' : '+esc(m.score_b)+'</p>'}).join(''):'<p class="muted">Подтверждённых результатов пока нет.</p>'}}
if(key==='rankings'){var rows=await apiList('rankings?scope=teams');var body=document.getElementById('rankingRows');if(body&&rows.length)body.innerHTML=rows.map(function(row,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(row.name)+' <span class="muted">'+esc(row.tag)+'</span></td><td>'+esc(row.matches_played||0)+'</td><td>'+esc(row.wins||0)+'</td><td>'+esc(row.wins||0)+'</td></tr>'}).join('')}
if(key==='seasons'){var seasons=await apiList('seasons');var target=document.getElementById('seasonResults');if(target&&seasons.length)target.innerHTML=cardList(seasons.map(function(s){return {title:s.title,description:s.status,starts_at:s.starts_at}}),'tournaments')}
}catch(error){console.warn('MERCY ARENA API unavailable:',error.message)}
}
window.addEventListener('hashchange',route);route();
})();
</script>
