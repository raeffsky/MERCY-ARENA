<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>MERCY ARENA — Where champions are made</title>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090d;--panel:#11141d;--line:#292d39;--muted:#9298a7;--white:#f5f6fa;--blue:#6d78ff;--lime:#d7ff5e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Manrope,Arial,sans-serif}.topline{height:3px;background:linear-gradient(90deg,var(--blue),var(--lime))}.header{height:82px;border-bottom:1px solid #ffffff18;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px)}.brand{display:flex;align-items:center;gap:13px;color:var(--white);text-decoration:none}.brandmark{width:46px;height:46px;object-fit:contain}.brandname{font:800 20px 'Barlow Condensed';letter-spacing:2px}.brandname small{display:block;color:var(--muted);font:700 8px Manrope;letter-spacing:3px;margin-top:2px}.menu{border:1px solid #ffffff35;background:transparent;color:white;width:46px;height:46px;cursor:pointer}.menu iconify-icon{font-size:25px}.drawer{position:fixed;inset:0 0 0 auto;width:min(390px,90vw);background:#11141d;border-left:1px solid #34394b;z-index:5;padding:25px;transform:translateX(105%);transition:.25s}.drawer.open{transform:none}.drawerhead{display:flex;justify-content:space-between;align-items:center;padding-bottom:25px;border-bottom:1px solid #ffffff20}.close{background:none;color:white;border:1px solid #ffffff35;width:40px;height:40px;font-size:22px}.links{display:grid;gap:7px;margin-top:25px}.links a{padding:15px;color:#d7d9e0;text-decoration:none;border:1px solid transparent;font-size:12px;font-weight:800;letter-spacing:.8px}.links a:hover,.links a.active{border-color:#d7ff5e55;color:var(--lime);background:#ffffff08}.links iconify-icon{font-size:19px;margin-right:12px;vertical-align:middle}.shade{position:fixed;inset:0;background:#000b;z-index:4;display:none}.shade.open{display:block}.hero{max-width:1400px;margin:auto;padding:clamp(70px,11vw,150px) clamp(20px,6vw,90px) 90px;min-height:580px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:520px;height:520px;right:2%;top:20px;border:1px solid #6d78ff35;transform:rotate(45deg);box-shadow:0 0 0 35px #6d78ff08,0 0 0 75px #6d78ff05;pointer-events:none}.eyebrow{color:var(--lime);font-size:10px;font-weight:800;letter-spacing:3px}.hero h1{font:900 clamp(70px,11vw,150px)/.82 'Barlow Condensed';margin:25px 0;text-transform:uppercase;position:relative;z-index:1}.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1px #aeb5ff}.hero p{max-width:490px;color:#a7abba;font-size:13px;line-height:1.9;position:relative;z-index:1}.actions{display:flex;gap:12px;margin-top:30px;position:relative;z-index:1}.btn{padding:14px 20px;text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:1px;text-decoration:none}.primary{background:var(--lime);color:#10120a}.secondary{border:1px solid #50566b;color:white}.content{max-width:1400px;margin:auto;padding:20px clamp(20px,6vw,90px) 90px}.kicker{color:var(--blue);font-size:9px;font-weight:900;letter-spacing:2px}.content h2{font:800 48px 'Barlow Condensed';margin:8px 0 25px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:var(--panel);border:1px solid var(--line);padding:25px;min-height:150px}.card iconify-icon{font-size:25px;color:var(--lime)}.card h3{font:700 23px 'Barlow Condensed';margin:14px 0 7px}.card p,.empty p{color:var(--muted);font-size:11px;line-height:1.8}.empty{margin-top:18px;padding:22px;border:1px solid var(--line);background:#0d1119}.empty b{font-size:12px}.footer{border-top:1px solid #ffffff18;padding:25px clamp(20px,6vw,90px);color:#858b9c;font-size:9px;letter-spacing:2px}.footer strong{color:white}@media(max-width:650px){.hero{min-height:520px}.hero:after{width:280px;height:280px;right:-130px;top:100px}.hero h1{font-size:76px}.content h2{font-size:38px}}
</style></head>
<body><div class="topline"></div>
<header class="header"><a class="brand" href="#/home"><img class="brandmark" src="public/assets/brand/mercy-mark.png" alt="MERCY ARENA"><span class="brandname">MERCY ARENA<small>MERCY CIRCUIT</small></span></a><button class="menu" id="open" aria-label="Открыть меню"><iconify-icon icon="mdi:menu"></iconify-icon></button></header>
<div class="shade" id="shade"></div><aside class="drawer" id="drawer"><div class="drawerhead"><a class="brand" href="#/home"><img class="brandmark" src="public/assets/brand/mercy-mark.png" alt=""><span class="brandname">MERCY ARENA<small>MERCY CIRCUIT</small></span></a><button class="close" id="close" aria-label="Закрыть">×</button></div><nav class="links">
<a href="#/home" data-route="home"><iconify-icon icon="mdi:home-outline"></iconify-icon>Главная</a><a href="#/tournaments" data-route="tournaments"><iconify-icon icon="mdi:trophy-outline"></iconify-icon>Турниры</a><a href="#/teams" data-route="teams"><iconify-icon icon="mdi:account-group-outline"></iconify-icon>Команды</a><a href="#/players" data-route="players"><iconify-icon icon="mdi:account-outline"></iconify-icon>Игроки</a><a href="#/brackets" data-route="brackets"><iconify-icon icon="mdi:tournament"></iconify-icon>Сетки и матчи</a><a href="#/rankings" data-route="rankings"><iconify-icon icon="mdi:chart-line"></iconify-icon>Рейтинги</a><a href="#/seasons" data-route="seasons"><iconify-icon icon="mdi:calendar-star-outline"></iconify-icon>Сезоны</a><a href="#/engine" data-route="engine"><iconify-icon icon="mdi:robot-outline"></iconify-icon>Auto Result Engine</a><a href="#/organizer" data-route="organizer"><iconify-icon icon="mdi:shield-crown-outline"></iconify-icon>Кабинет организатора</a></nav></aside>
<main id="app"></main><footer class="footer"><strong>MERCY ARENA</strong> · WHERE CHAMPIONS ARE MADE</footer>
<script>
const app=document.getElementById('app'),drawer=document.getElementById('drawer'),shade=document.getElementById('shade');
function menu(v){drawer.classList.toggle('open',v);shade.classList.toggle('open',v)}
document.getElementById('open').onclick=()=>menu(true);document.getElementById('close').onclick=()=>menu(false);shade.onclick=()=>menu(false);
const intro=(tag,title,desc)=>'<section class="content"><div class="kicker">'+tag+'</div><h2>'+title+'</h2><p>'+desc+'</p>';
const card=(icon,title,desc)=>'<article class="card"><iconify-icon icon="'+icon+'"></iconify-icon><h3>'+title+'</h3><p>'+desc+'</p></article>';
const empty=(title,desc)=>'<div class="empty"><b>'+title+'</b><p>'+desc+'</p></div>';
const pages={
home:()=>`<section class="hero"><div class="eyebrow">MOBILE LEGENDS · COMPETITIVE PLATFORM</div><h1>PLAY TO <span>WIN.</span></h1><p>MERCY ARENA — пространство, где игроки, команды и организаторы встречаются ради настоящей конкуренции. Турниры, матчи, рейтинги и путь к чемпионству в одной экосистеме.</p><div class="actions"><a class="btn primary" href="#/tournaments">Смотреть турниры</a><a class="btn secondary" href="#/about">О платформе</a></div></section>
<section class="content"><div class="kicker">BUILT FOR COMPETITION</div><h2>ОДНА АРЕНА. ОДНА ЦЕЛЬ.</h2><div class="cards">
<a class="card" href="#/tournaments" style="display:block;text-decoration:none;color:inherit"><iconify-icon icon="mdi:trophy-outline"></iconify-icon><h3>Турниры</h3><p>Находи соревнования, изучай условия и следи за ходом турниров.</p></a>
<a class="card" href="#/teams" style="display:block;text-decoration:none;color:inherit"><iconify-icon icon="mdi:account-group-outline"></iconify-icon><h3>Команды</h3><p>Составы, капитаны, достижения и история выступлений.</p></a>
<a class="card" href="#/players" style="display:block;text-decoration:none;color:inherit"><iconify-icon icon="mdi:account-outline"></iconify-icon><h3>Игроки</h3><p>Профили участников, игровые роли и личная статистика.</p></a>
<a class="card" href="#/brackets" style="display:block;text-decoration:none;color:inherit"><iconify-icon icon="mdi:tournament"></iconify-icon><h3>Матчи и сетки</h3><p>Расписание встреч, турнирные пары и путь к финалу.</p></a>
</div></section>
<section class="content"><div class="kicker">MATCH CENTER</div><h2>ЦЕНТР СОБЫТИЙ</h2><div class="cards">
<article class="card"><iconify-icon icon="mdi:calendar-clock-outline"></iconify-icon><h3>Ближайшие матчи</h3><p>Здесь будут отображаться подтверждённые матчи и время их проведения.</p></article>
<article class="card"><iconify-icon icon="mdi:check-decagram-outline"></iconify-icon><h3>Последние результаты</h3><p>Публикуем только проверенные итоги. Неподтверждённые результаты не попадут в таблицу.</p></article>
</div><div class="empty"><b>Матчей пока нет</b><p>Когда организаторы опубликуют первый турнир и расписание, здесь появятся ближайшие встречи и результаты.</p><a class="btn secondary" href="#/brackets" style="display:inline-block;margin-top:10px">Открыть центр матчей</a></div></section>
<section class="content"><div class="kicker">COMPETITIVE LADDER</div><h2>ТАБЛИЦА ЛИДЕРОВ</h2><div class="cards">
<article class="card"><iconify-icon icon="mdi:shield-star-outline"></iconify-icon><h3>Командный рейтинг</h3><p>Позиции команд на основе подтверждённых результатов.</p><a class="btn secondary" href="#/rankings" style="display:inline-block;margin-top:10px">Смотреть рейтинг</a></article>
<article class="card"><iconify-icon icon="mdi:medal-outline"></iconify-icon><h3>Рейтинг игроков</h3><p>Индивидуальные достижения и вклад в победы.</p><a class="btn secondary" href="#/rankings" style="display:inline-block;margin-top:10px">Таблица игроков</a></article>
</div><div class="empty"><b>Рейтинг ещё не сформирован</b><p>Не будем рисовать вымышленные места и очки. Таблицы заполнятся после первых подтверждённых матчей.</p></div></section>
<section class="content"><div class="kicker">TRUSTED MATCH DATA</div><h2>AUTO RESULT ENGINE</h2><div class="cards">
<article class="card"><iconify-icon icon="mdi:cloud-sync-outline"></iconify-icon><h3>Получение данных</h3><p>Подключение источника результатов и получение данных после завершения матча.</p></article>
<article class="card"><iconify-icon icon="mdi:shield-check-outline"></iconify-icon><h3>Проверка результата</h3><p>Сверка матча, участников и итогового счёта перед публикацией.</p></article>
<article class="card"><iconify-icon icon="mdi:refresh-auto"></iconify-icon><h3>Обновление турнира</h3><p>После подтверждения результата обновляются сетка и турнирная таблица.</p></article>
</div><div class="empty"><b>Система ожидает подключения источника</b><p>Автоматическая публикация результатов пока не активна. До появления надёжной интеграции результаты должны проходить ручную проверку.</p><a class="btn secondary" href="#/engine" style="display:inline-block;margin-top:10px">Подробнее о системе</a></div></section>
<section class="content"><div class="kicker">YOUR NEXT MOVE</div><h2>ТВОЯ ИГРА. ТВОЯ АРЕНА.</h2><p style="max-width:560px;color:var(--muted);font-size:12px;line-height:1.9">Следи за турнирами, собирай команду и готовься к соревнованиям. MERCY ARENA создаётся как единая площадка для честной и прозрачной конкуренции.</p><div class="actions"><a class="btn primary" href="#/tournaments">Перейти к турнирам</a><a class="btn secondary" href="#/teams">Раздел команд</a></div></section>`,
tournaments:()=>intro('MERCY CIRCUIT / COMPETE','ТУРНИРЫ','Каталог соревнований MERCY ARENA.')+'<div class="cards">'+card('mdi:trophy-outline','Открытые турниры','Соревнования с активной регистрацией.')+card('mdi:calendar-clock-outline','Скоро стартуют','Ближайшие соревнования и расписание.')+card('mdi:check-decagram-outline','Завершённые','Архив турниров и подтверждённые итоги.')+'</div>'+empty('Турниры пока не опубликованы','Здесь появятся реальные соревнования после публикации организаторами.')+'</section>',
teams:()=>intro('COMMUNITY / SQUADS','КОМАНДЫ','Командные профили, составы и история выступлений.')+'<div class="cards">'+card('mdi:account-group-outline','Каталог команд','Зарегистрированные команды.')+card('mdi:shield-account-outline','Составы','Игроки, замены и капитаны.')+'</div>'+empty('Команды ещё не зарегистрированы','Первые команды появятся после создания профилей.')+'</section>',
players:()=>intro('PLAYER DATABASE','ИГРОКИ','Профили участников, роли и индивидуальная статистика.')+'<div class="cards">'+card('mdi:card-account-details-outline','Профили','Игровые идентификаторы и роли.')+card('mdi:medal-outline','Достижения','Награды и история результатов.')+'</div>'+empty('Профили пока отсутствуют','Здесь появятся зарегистрированные игроки.')+'</section>',
brackets:()=>intro('MATCH CENTER','СЕТКИ И МАТЧИ','Турнирные сетки, пары команд, расписание и статусы встреч.')+'<div class="cards">'+card('mdi:graph-outline','Single Elimination','Сетка на выбывание.')+card('mdi:tournament','Double Elimination','Верхняя и нижняя сетки.')+card('mdi:calendar-clock-outline','Расписание','Время и статусы матчей.')+'</div>'+empty('Матчи не найдены','Матчи появятся после публикации первого турнира.')+'</section>',
rankings:()=>intro('COMPETITIVE LADDER','РЕЙТИНГИ','Таблицы лидеров на основе подтверждённых результатов.')+'<div class="cards">'+card('mdi:shield-star-outline','Команды','Командный рейтинг.')+card('mdi:account-star-outline','Игроки','Индивидуальный рейтинг.')+'</div>'+empty('Рейтинг пока не сформирован','Таблицы появятся после первых подтверждённых матчей.')+'</section>',
seasons:()=>intro('SEASON SYSTEM','СЕЗОНЫ','Соревновательные сезоны, этапы и итоговые чемпионаты.')+'<div class="cards">'+card('mdi:calendar-star-outline','Сезонная таблица','Общий зачёт сезона.')+card('mdi:flag-checkered','Этапы','Квалификации и финалы.')+'</div>'+empty('Сезоны ещё не запущены','Первый сезон появится после объявления календаря.')+'</section>',
engine:()=>intro('AUTOMATION / VERIFIED DATA','AUTO RESULT ENGINE','Получение, проверка и публикация результатов матчей.')+'<div class="cards">'+card('mdi:cloud-download-outline','Получение','Данные из подключённых источников.')+card('mdi:shield-check-outline','Проверка','Валидация и разрешение конфликтов.')+card('mdi:publish','Публикация','Обновление сеток после подтверждения.')+'</div>'+empty('Интеграция не подключена','Автоматические результаты не публикуются до подключения надёжного источника.')+'</section>',
organizer:()=>intro('ORGANIZER HUB','КАБИНЕТ ОРГАНИЗАТОРА','Создание турниров, заявки, сетки и судейские решения.')+'<div class="cards">'+card('mdi:trophy-plus-outline','Турниры','Настройка формата и регистрации.')+card('mdi:account-multiple-check-outline','Заявки','Проверка составов и допуска.')+card('mdi:gavel','Судейская','Спорные результаты и решения.')+'</div>'+empty('Требуется авторизация','Кабинет будет доступен аккаунтам с ролью организатора. Авторизация пока не подключена.')+'</section>',
about:()=>intro('THE PLATFORM','О ПЛАТФОРМЕ','MERCY ARENA объединяет игроков, команды, организаторов и турнирную инфраструктуру.')+'<div class="cards">'+card('mdi:account-plus-outline','Единые профили','Профили игроков и команд.')+card('mdi:trophy-outline','Турнирная система','Регистрация, сетки и результаты.')+card('mdi:robot-outline','Проверка результатов','Публикация только подтверждённых данных.')+'</div></section>'
};
function route(){let key=location.hash.replace(/^#\/?/,'').split('/')[0]||'home';if(!pages[key])key='home';app.innerHTML=pages[key]();document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===key));menu(false);window.scrollTo(0,0);document.title=(key==='home'?'MERCY ARENA':key.toUpperCase()+' — MERCY ARENA')}
window.addEventListener('hashchange',route);route();
</script></body></html>
