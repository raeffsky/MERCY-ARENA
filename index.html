<style>
:root{--bg:#08090d;--panel:#11141d;--panel2:#0d1017;--line:#292d39;--muted:#9298a7;--white:#f5f6fa;--blue:#6d78ff;--lime:#d7ff5e;--red:#ff7272;--green:#b9e85a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--white);font-family:Manrope,Arial,sans-serif}button,input,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit}.topline{height:3px;background:linear-gradient(90deg,var(--blue),var(--lime))}
.header{height:82px;border-bottom:1px solid #ffffff18;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px);position:sticky;top:0;background:#08090df2;backdrop-filter:blur(16px);z-index:10}
.brand{display:flex;align-items:center;gap:13px;color:var(--white);text-decoration:none}.brandmark{width:46px;height:46px;object-fit:contain}.brandname{font:800 20px 'Barlow Condensed';letter-spacing:2px}.brandname small{display:block;color:var(--muted);font:700 8px Manrope;letter-spacing:3px;margin-top:2px}
.menu{border:1px solid #ffffff35;background:transparent;color:white;width:46px;height:46px;cursor:pointer;display:grid;place-items:center}.menu iconify-icon{font-size:25px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(390px,90vw);background:#11141d;border-left:1px solid #34394b;z-index:21;padding:25px;transform:translateX(105%);transition:.25s;overflow:auto}.drawer.open{transform:none}.drawerhead{display:flex;justify-content:space-between;align-items:center;padding-bottom:25px;border-bottom:1px solid #ffffff20}.close{background:none;color:white;border:1px solid #ffffff35;width:40px;height:40px;font-size:22px}.links{display:grid;gap:7px;margin-top:25px}.links a{padding:14px;color:#d7d9e0;text-decoration:none;border:1px solid transparent;font-size:12px;font-weight:800;letter-spacing:.5px}.links a:hover,.links a.active{border-color:#d7ff5e55;color:var(--lime);background:#ffffff08}.links iconify-icon{font-size:19px;margin-right:12px;vertical-align:middle}.shade{position:fixed;inset:0;background:#000b;z-index:20;display:none}.shade.open{display:block}
main{min-height:65vh}.wrap{width:min(1180px,100%);margin:auto;padding-left:clamp(20px,5vw,64px);padding-right:clamp(20px,5vw,64px)}
.hero{max-width:1400px;margin:auto;padding:clamp(62px,9vw,112px) clamp(20px,6vw,90px) 76px;min-height:470px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:430px;height:430px;right:5%;top:20px;border:1px solid #6d78ff35;transform:rotate(45deg);box-shadow:0 0 0 35px #6d78ff08,0 0 0 75px #6d78ff05;pointer-events:none}
.eyebrow,.kicker{font-size:10px;font-weight:800;letter-spacing:2.6px}.eyebrow{color:var(--lime)}.hero h1{font:900 clamp(68px,10vw,128px)/.82 'Barlow Condensed';margin:24px 0;text-transform:uppercase;position:relative;z-index:1}.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1px #aeb5ff}.hero p{max-width:510px;color:#a7abba;font-size:13px;line-height:1.9;position:relative;z-index:1}.actions{display:flex;gap:12px;margin-top:25px;position:relative;z-index:1;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 19px;text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:1px;text-decoration:none;border:0;cursor:pointer;min-height:44px}.primary{background:var(--lime);color:#10120a}.secondary{border:1px solid #50566b;color:white;background:transparent}.quiet{border:1px solid var(--line);color:#c9ccd6;background:var(--panel2)}.btn:hover{filter:brightness(1.08)}
.section{padding-top:32px;padding-bottom:44px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.kicker{color:var(--blue)}.section h2,.page-title{font:800 clamp(35px,5vw,52px)/1.03 'Barlow Condensed';margin:9px 0 0;text-transform:uppercase}.section-head .sub{font-size:11px;color:var(--muted);max-width:390px;line-height:1.7;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{background:var(--panel);border:1px solid var(--line);padding:22px;min-height:140px;display:block;text-decoration:none;transition:border-color .18s,transform .18s}.tile:hover{border-color:#d7ff5e66;transform:translateY(-2px)}.tile iconify-icon{font-size:24px;color:var(--lime)}.tile h3{font:700 23px 'Barlow Condensed';margin:13px 0 6px}.tile p{color:var(--muted);font-size:11px;line-height:1.8;margin:0}
.statusbar{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:10px;letter-spacing:.4px}.dot{width:7px;height:7px;border-radius:50%;background:var(--lime);display:inline-block}.dot.off{background:#7b8190}.panel{background:var(--panel);border:1px solid var(--line);padding:20px}.panel-title{font:700 22px 'Barlow Condensed';margin:0 0 7px}.muted{color:var(--muted);font-size:11px;line-height:1.8}.empty{border:1px dashed #3b4050;background:#0d1017;padding:24px;text-align:left}.empty-row{display:flex;gap:14px;align-items:flex-start}.empty iconify-icon{font-size:25px;color:#8d93a3;flex:none}.empty b{font-size:12px}.empty p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.7}
.statline{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--panel2)}.stat{padding:17px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat strong{display:block;font:700 27px 'Barlow Condensed'}.stat span{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1px}
.pagehead{padding-top:65px;padding-bottom:28px}.pagehead .page-title{font-size:clamp(46px,7vw,72px);margin:12px 0}.pagehead .lead{color:var(--muted);font-size:12px;line-height:1.9;max-width:650px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.field{min-height:44px;background:#10131b;border:1px solid var(--line);color:var(--white);padding:0 13px;outline:none;min-width:180px}.field:focus{border-color:var(--blue)}.field::placeholder{color:#737989}
.table-wrap{overflow:auto;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:11px}th{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1px;background:#10131b}td{color:#d9dce5}tr:last-child td{border-bottom:0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.step{border:1px solid var(--line);background:var(--panel);padding:18px}.step-num{font:800 28px 'Barlow Condensed';color:var(--lime)}.step h3{font:700 20px 'Barlow Condensed';margin:8px 0}.step p{color:var(--muted);font-size:10px;line-height:1.8;margin:0}
.footer{border-top:1px solid #ffffff18;padding:24px clamp(20px,6vw,90px);color:#858b9c;font-size:9px;letter-spacing:2px}.footer strong{color:white}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.steps{grid-template-columns:1fr}.hero{min-height:440px}.hero:after{width:280px;height:280px;right:-140px;top:90px}.section-head{align-items:start;flex-direction:column}.section-head .sub{max-width:none}}
@media(max-width:480px){.header{height:76px}.brandmark{width:42px;height:42px}.brandname{font-size:18px}.hero{padding-top:64px;padding-bottom:52px;min-height:410px}.hero h1{font-size:76px}.hero p{font-size:12px}.grid,.grid.two{grid-template-columns:1fr}.tile{min-height:0;padding:20px}.stat{padding:12px 9px}.stat strong{font-size:23px}.stat span{font-size:8px}.pagehead{padding-top:48px}}
</style>

<script>
(function(){
'use strict';
var app=document.getElementById('app'),drawer=document.getElementById('drawer'),shade=document.getElementById('shade');
function menu(open){drawer.classList.toggle('open',open);shade.classList.toggle('open',open);document.body.style.overflow=open?'hidden':''}
document.getElementById('open').addEventListener('click',function(){menu(true)});
document.getElementById('close').addEventListener('click',function(){menu(false)});
shade.addEventListener('click',function(){menu(false)});
function pageHead(kicker,title,lead){return '<section class="wrap pagehead"><div class="kicker">'+kicker+'</div><h1 class="page-title">'+title+'</h1><p class="lead">'+lead+'</p></section>'}
function empty(icon,title,desc,link,label){return '<div class="empty"><div class="empty-row"><iconify-icon icon="'+icon+'"></iconify-icon><div><b>'+title+'</b><p>'+desc+'</p>'+(link?'<a class="btn secondary" style="margin-top:14px" href="'+link+'">'+label+'</a>':'')+'</div></div></div>'}
function tile(icon,title,desc,href){return '<a class="tile" href="'+href+'"><iconify-icon icon="'+icon+'"></iconify-icon><h3>'+title+'</h3><p>'+desc+'</p></a>'}
function section(kicker,title,sub,body){return '<section class="wrap section"><div class="section-head"><div><div class="kicker">'+kicker+'</div><h2>'+title+'</h2></div>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div>'+body+'</section>'}
var pages={
home:function(){return [
'<section class="hero"><div class="eyebrow">MOBILE LEGENDS: BANG BANG · ESPORTS</div><h1>PLAY TO <span>WIN.</span></h1><p>Турниры, команды и матчи MLBB в одном месте. Следи за соревнованиями и проверенными результатами.</p><div class="actions"><a class="btn primary" href="#/tournaments">Найти турнир <iconify-icon icon="mdi:arrow-up-right"></iconify-icon></a><a class="btn secondary" href="#/brackets">Матчи и сетки</a></div></section>',
section('MERCY CIRCUIT','ТУРНИРЫ','Только актуальные соревнования и понятный статус регистрации.','<div class="grid two"><div class="panel"><div class="statusbar"><span class="dot off"></span>НЕТ ОПУБЛИКОВАННЫХ ТУРНИРОВ</div><h3 class="panel-title" style="margin-top:15px">Следующий турнир ещё не объявлен</h3><p class="muted">Когда организатор опубликует соревнование, здесь появятся формат, даты и условия участия.</p><a class="btn secondary" href="#/tournaments" style="margin-top:12px">Все турниры</a></div><div class="panel"><div class="kicker">КАК ЭТО РАБОТАЕТ</div><h3 class="panel-title" style="margin-top:15px">От регистрации до финала</h3><p class="muted">Выбирай турнир, изучай правила, следи за сеткой и результатами матчей.</p><a class="btn quiet" href="#/about" style="margin-top:12px">О платформе</a></div></div>'),
section('MATCH CENTER','МАТЧИ И РЕЗУЛЬТАТЫ','Расписание и итоги без вымышленных данных.','<div class="grid two"><div class="panel"><div class="statusbar"><span class="dot off"></span>РАСПИСАНИЕ ПУСТО</div><h3 class="panel-title" style="margin-top:15px">Ближайшие матчи</h3><p class="muted">Матчи появятся после публикации турнирной сетки.</p></div><div class="panel"><div class="statusbar"><span class="dot off"></span>НЕТ ПОДТВЕРЖДЁННЫХ ИТОГОВ</div><h3 class="panel-title" style="margin-top:15px">Последние результаты</h3><p class="muted">В ленту попадают только результаты, прошедшие проверку.</p></div></div><div style="margin-top:12px"><a class="btn secondary" href="#/brackets">Открыть центр матчей</a></div>'),
section('COMPETITIVE LADDER','РЕЙТИНГИ','Позиции формируются только на основе сыгранных и подтверждённых матчей.','<div class="grid two"><div class="panel"><h3 class="panel-title">Командный рейтинг</h3><p class="muted">Таблица будет доступна после первых результатов.</p><a class="btn quiet" href="#/rankings" style="margin-top:10px">Открыть рейтинг</a></div><div class="panel"><h3 class="panel-title">Игроки</h3><p class="muted">Индивидуальная статистика и достижения участников.</p><a class="btn quiet" href="#/players" style="margin-top:10px">Каталог игроков</a></div></div>'),
'<section class="wrap section"><div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap"><div><div class="kicker">AUTOMATED MATCH VALIDATION</div><h2 style="font:800 30px Barlow Condensed;margin:8px 0">AUTO RESULT ENGINE</h2><p class="muted" style="max-width:540px">Автоматическое получение и проверка результатов. Публикация включается только после подключения источника данных.</p></div><a class="btn secondary" href="#/engine">Статус системы</a></div></section>'
].join('')},
tournaments:function(){return pageHead('MERCY CIRCUIT / COMPETE','ТУРНИРЫ','Каталог соревнований Mobile Legends: Bang Bang. Здесь будут отображаться правила, формат, даты, статус регистрации и список участников.')+
'<section class="wrap section"><div class="toolbar"><input class="field" id="tSearch" type="search" placeholder="Поиск турнира..." aria-label="Поиск турнира"><select class="field" id="tStatus" aria-label="Статус турнира"><option value="all">Все статусы</option><option value="registration">Регистрация</option><option value="live">Идёт</option><option value="finished">Завершён</option></select><select class="field" id="tFormat" aria-label="Формат"><option value="all">Любой формат</option><option>Single Elimination</option><option>Double Elimination</option><option>Round Robin</option></select></div><div id="tResults">'+empty('mdi:trophy-outline','Пока нет опубликованных турниров','Список заполнится после того, как организатор создаст и опубликует первое соревнование.')+'</div></section>'},
teams:function(){return pageHead('COMMUNITY / SQUADS','КОМАНДЫ','Каталог команд с игровыми тегами, капитанами, составами и историей выступлений.')+
'<section class="wrap section"><div class="toolbar"><input class="field" id="teamSearch" type="search" placeholder="Название или тег команды..." aria-label="Поиск команды"><select class="field" id="teamSort"><option value="new">Сначала новые</option><option value="name">По названию</option></select></div><div id="teamResults">'+empty('mdi:account-group-outline','Команд пока нет','Здесь появятся команды, зарегистрированные в MERCY ARENA.')+'</div></section>'},
players:function(){return pageHead('PLAYER DATABASE','ИГРОКИ','Профили участников: игровой ник, команда, основная роль и подтверждённая статистика.')+
'<section class="wrap section"><div class="toolbar"><input class="field" id="playerSearch" type="search" placeholder="Ник игрока..." aria-label="Поиск игрока"><select class="field" id="playerRole"><option value="all">Все роли</option><option>EXP Lane</option><option>Jungler</option><option>Mid Lane</option><option>Gold Lane</option><option>Roamer</option></select></div><div id="playerResults">'+empty('mdi:account-search-outline','Игроки не найдены','Профили появятся после подключения регистрации игроков.')+'</div></section>'},
brackets:function(){return pageHead('MATCH CENTER','СЕТКИ И МАТЧИ','Центр соревнований: расписание, пары, статусы встреч и подтверждённые результаты.')+
'<section class="wrap section"><div class="toolbar"><select class="field" id="matchStatus"><option value="all">Все матчи</option><option value="upcoming">Предстоящие</option><option value="live">В эфире</option><option value="completed">Завершённые</option></select><input class="field" id="matchSearch" type="search" placeholder="Турнир или команда..." aria-label="Поиск матча"></div><div class="grid two"><div class="panel"><div class="kicker">SCHEDULE</div><h3 class="panel-title" style="margin-top:10px">Расписание</h3><p class="muted">Здесь будут предстоящие матчи и время начала.</p></div><div class="panel"><div class="kicker">RESULTS</div><h3 class="panel-title" style="margin-top:10px">Результаты</h3><p class="muted">Итоги появляются только после подтверждения.</p></div></div><div style="margin-top:14px">'+empty('mdi:tournament','Матчей пока нет','Сначала должен быть опубликован турнир и сформирована его сетка.')+'</div></section>'},
rankings:function(){return pageHead('COMPETITIVE LADDER','РЕЙТИНГИ','Турнирные таблицы команд и игроков. Рейтинг не рассчитывается по неподтверждённым матчам.')+
'<section class="wrap section"><div class="toolbar"><select class="field" id="rankType"><option value="teams">Командный рейтинг</option><option value="players">Рейтинг игроков</option></select><select class="field" id="rankSeason"><option value="current">Текущий сезон</option><option value="all">За всё время</option></select></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Участник</th><th>Матчи</th><th>Победы</th><th>Очки</th></tr></thead><tbody><tr><td colspan="5" style="text-align:center;padding:35px;color:#9298a7">Рейтинг будет сформирован после первых подтверждённых матчей.</td></tr></tbody></table></div></section>'},
seasons:function(){return pageHead('SEASON SYSTEM','СЕЗОНЫ','Соревновательные периоды, этапы, квалификации и итоговые чемпионаты.')+
