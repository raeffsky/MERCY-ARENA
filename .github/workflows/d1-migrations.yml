name: MERCY ARENA production D1 migration audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d1-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercy-arena-production-d1-migrations
  cancel-in-progress: false

jobs:
  audit-production-d1:
    name: Read-only production D1 schema audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_NAME"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"

      - name: Create temporary Wrangler D1 config
        env:
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const name = process.env.CLOUDFLARE_D1_DATABASE_NAME;
          const id = process.env.CLOUDFLARE_D1_DATABASE_ID;
          if (!name || !/^[0-9a-f-]{36}$/i.test(id || '')) throw new Error('Invalid D1 database name or UUID');
          fs.writeFileSync('wrangler.migrations.json', JSON.stringify({
            name: 'mercy-arena-audit',
            compatibility_date: '2026-11-10',
            d1_databases: [{ binding: 'DB', database_name: name, database_id: id, migrations_dir: 'migrations' }]
          }, null, 2));
          NODE

      - name: Inspect applied migration ledger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations list DB --remote --config wrangler.migrations.json

      - name: Inspect production tables and columns (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute DB --remote --config wrangler.migrations.json --command "SELECT m.name AS table_name, p.cid, p.name AS column_name, p.type, p.notnull, p.pk FROM sqlite_master AS m JOIN pragma_table_info(m.name) AS p WHERE m.type='table' AND m.name NOT LIKE 'sqlite_%' ORDER BY m.name, p.cid;"
