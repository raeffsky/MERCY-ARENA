name: MERCY ARENA checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mercy-arena-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-tests:
    name: Build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Check API JavaScript syntax
        run: find functions -name '*.js' -print0 | xargs -0 -n1 sh -c 'node --input-type=module --check < "$0"'
      - name: Build static site
        run: npm run build
      - name: Run desktop and mobile tests
        run: npm run test:e2e
